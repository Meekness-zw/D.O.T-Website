<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — dot. Delivery</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', system-ui, sans-serif; background: #0D0D0D; color: #E8E6E1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center; -webkit-font-smoothing: antialiased; }
    a { color: #F5A623; text-decoration: none; }
    .code { font-size: clamp(5rem, 20vw, 10rem); font-weight: 900; letter-spacing: -6px; line-height: 1; color: rgba(245,166,35,0.15); margin-bottom: 1rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; letter-spacing: -1px; margin-bottom: 0.75rem; }
    p { font-size: 1rem; color: rgba(232,230,225,0.5); line-height: 1.75; max-width: 400px; margin: 0 auto 2.5rem; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; background: #F5A623; color: #000; font-weight: 800; font-size: 0.95rem; padding: 0.85rem 1.75rem; border-radius: 9999px; text-decoration: none; }
    .btn-primary:hover { background: #E8941A; }
    .btn-outline { display: inline-flex; align-items: center; gap: 0.5rem; border: 1px solid rgba(255,255,255,0.15); color: rgba(232,230,225,0.7); font-weight: 600; font-size: 0.95rem; padding: 0.85rem 1.75rem; border-radius: 9999px; text-decoration: none; }
    .btn-outline:hover { border-color: #F5A623; color: #F5A623; }
    .logo { margin-bottom: 3rem; opacity: 0.6; }
    .logo img { height: 48px; filter: brightness(0) invert(1); }
    nav { display: flex; gap: 1.5rem; margin-top: 3rem; font-size: 0.85rem; flex-wrap: wrap; justify-content: center; }
    nav a { color: rgba(232,230,225,0.35); }
    nav a:hover { color: #F5A623; }
  </style>
</head>
<body>
  <a href="/" class="logo"><img src="/dot-on-time-white.png" alt="dot." /></a>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <div class="actions">
    <a href="/" class="btn-primary">Go to Home</a>
    <a href="/help" class="btn-outline">Help Centre</a>
  </div>
  <nav>
    <a href="/food-delivery">Food Delivery</a>
    <a href="/harare">Harare</a>
    <a href="/bulawayo">Bulawayo</a>
    <a href="/about">About</a>
    <a href="/blog">Blog</a>
  </nav>
</body>
</html>
